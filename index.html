<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simon Game - Memory Challenge</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/344/pokedex.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <center>
        <h1 class="game-title">Simon Game</h1>
        <h3 class="display">Press start button to begin!</h3>
        <h5 class="score">Score: 0</h5>
        <h5 class="high-score">High Score: 0</h5>
        
        <div class="btn-container">
            <button class="btn red" data-color="red" aria-label="Red Button"></button>
            <button class="btn green" data-color="green" aria-label="Green Button"></button>
            <br>
            <button class="btn yellow" data-color="yellow" aria-label="Yellow Button"></button>
            <button class="btn blue" data-color="blue" aria-label="Blue Button"></button>
        </div>

        <button class="s-btn">Start Game</button>
        <button class="theme-toggle">Toggle Theme</button>
    </center>

    <div class="footer">
        <a href="https://github.com/subhranshuchoudhury/simon-game/" title="Source code for this project">GitHub</a>
        <a href="https://youtu.be/1Yqj76Q4jJ4">How to Play?</a><br>
        <h5 class="thanks">@SubhranshuChoudhury</h5>
    </div>
</body>
</html>
